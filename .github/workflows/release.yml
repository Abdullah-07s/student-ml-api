name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: python -m pytest

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ steps.get_version.outputs.version }} \
            --build-arg GIT_COMMIT=${{ github.sha }} \
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            -t ghcr.io/abdullah-07s/student-ml-api:${{ steps.get_version.outputs.version }} .

      - name: Tag image as latest
        run: |
          docker tag ghcr.io/abdullah-07s/student-ml-api:${{ steps.get_version.outputs.version }} ghcr.io/abdullah-07s/student-ml-api:latest

      - name: Tag image with commit SHA
        id: get_sha
        run: |
          FULL_SHA=${{ github.sha }}
          SHORT_SHA=${FULL_SHA:0:7}
          docker tag ghcr.io/abdullah-07s/student-ml-api:${{ steps.get_version.outputs.version }} ghcr.io/abdullah-07s/student-ml-api:$SHORT_SHA
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Push images
        run: |
          docker push ghcr.io/abdullah-07s/student-ml-api:${{ steps.get_version.outputs.version }}
          docker push ghcr.io/abdullah-07s/student-ml-api:latest
          docker push ghcr.io/abdullah-07s/student-ml-api:${{ steps.get_sha.outputs.short_sha }}
